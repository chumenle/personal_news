services:
  reader:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      NEWS_DATA_DIR: /app/data
      NEWS_SECURE_COOKIE: "true"
    volumes:
      - reader_data:/app/data
      - reader_backups:/app/backups
      - ./output/pdf:/imports:ro
    expose:
      - "3000"
  https:
    image: caddy:2
    restart: unless-stopped
    environment:
      NEWS_DOMAIN: ${NEWS_DOMAIN:?Set NEWS_DOMAIN to your domain}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - reader
volumes:
  reader_data:
  reader_backups:
  caddy_data:
  caddy_config:
